# logrotate config for lqg's log files (only written when global.log_dir
# is set in /etc/lqg/config.yaml). Installed by install.sh as
# /etc/logrotate.d/lqg. Adjust the path if your log_dir is elsewhere, and
# add any apps[].log_file outside it.
#
# No copytruncate: lqg reopens its files on SIGUSR1, so logrotate can
# simply rename them and signal the daemon.
/var/log/lqg/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root lqg
    sharedscripts
    postrotate
        systemctl kill -s USR1 --kill-whom=main lqg.service >/dev/null 2>&1 || true
    endscript
}
